<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computational Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<div class="header">
    <div class="label">
        <label>
            Particle Simulation (Work in Progress)
        </label>
    </div>

    <div class="large-box" id="largeBox">
        <div id="particles"></div>
        <div class="small-box" id="smallBox">
            <div class="nameplate">
                <div class="name">YOUNES TOUMI</div>
                <div class="title">Computational Engineer</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <label>
            <span class="control-label">Particles:</span>
            <span class="value-box" id="particleCountValue">10</span>
            <input type="range" id="particleCountSlider" min="1" max="50" value="10">
        </label>
        <label>
            <span class="control-label">Particles:</span>
            <span class="value-box" id="particleSizeValue">20</span>
            <input type="range" id="particleSizeSlider" min="10" max="50" value="20">
        </label>
        <label>
            <span class="control-label">Temperature:</span>
            <span class="value-box" id="temperatureValue">20</span>
            <input type="range" id="temperatureSlider" min="0" max="100" value="50">
        </label>
    </div>

    <script src="simulation.js"></script>
</div>

<body>
</body>
</html>
